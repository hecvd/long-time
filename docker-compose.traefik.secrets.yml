# Same as docker-compose.traefik.yml, but the Cloudflare token is read from a
# host file (Docker secret) instead of a clear-text environment variable — so
# nothing sensitive lives in the compose or Portainer's database.
#
# Before deploying:
#   mkdir -p secrets
#   printf '%s' 'YOUR_CLOUDFLARE_TOKEN' > secrets/cf_dns_api_token.txt
#   chmod 600 secrets/cf_dns_api_token.txt
# (secrets/ and letsencrypt/ are git-ignored.)
services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=you@example.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    environment:
      # lego reads the token from this file (works for any provider credential).
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_dns_api_token
    secrets:
      - cf_dns_api_token
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy

  long-time:
    image: ghcr.io/hecvd/long-time:latest
    container_name: long-time
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./config:/config
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.long-time.rule=Host(`long-time.example.com`)
      - traefik.http.routers.long-time.entrypoints=websecure
      - traefik.http.routers.long-time.tls=true
      - traefik.http.routers.long-time.tls.certresolver=le
      - traefik.http.services.long-time.loadbalancer.server.port=5225

networks:
  proxy:
    name: proxy

secrets:
  cf_dns_api_token:
    file: ./secrets/cf_dns_api_token.txt
