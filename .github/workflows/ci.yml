name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff check src tests
      - run: npm run lint
      - run: uv run pytest -q
      - run: npm test
